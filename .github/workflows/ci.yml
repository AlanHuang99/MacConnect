name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift test --parallel

      - name: Guard brittle app resources
        run: |
          if grep -R -n -E 'Bundle\.module|bundle: \.module' Sources; then
            echo "Do not use Bundle.module from app UI code; missing SwiftPM resource bundles crash at runtime." >&2
            exit 1
          fi

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: ./scripts/build-app.sh release

      - name: Verify bundle structure
        run: |
          test -f build/MacConnect.app/Contents/MacOS/MacConnect
          test -f build/MacConnect.app/Contents/Info.plist
          plutil -lint build/MacConnect.app/Contents/Info.plist
          test ! -d build/MacConnect.app/Contents/Resources/MacConnect_MacConnectApp.bundle
          if /usr/libexec/PlistBuddy -c 'Print :NSServices' build/MacConnect.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "NSServices should stay out of the generated app until the Services path has dedicated tests." >&2
            exit 1
          fi

  lint:
    name: Lint
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .
