name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build universal .app (direct channel + Sparkle)
        env:
          # Public key that verifies updates; pairs with the SPARKLE_ED_PRIVATE_KEY
          # secret used to sign the appcast below. Not secret. Set as a repo
          # variable once generated (see the README); falls back to the
          # placeholder baked into build-app.sh, which builds fine but won't
          # verify real updates.
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: ./scripts/build-app.sh release-universal "${{ steps.ver.outputs.version }}" direct

      - name: Verify universal binary
        run: |
          file build/MacConnect.app/Contents/MacOS/MacConnect
          lipo -info build/MacConnect.app/Contents/MacOS/MacConnect

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign with Developer ID (inside-out, Hardened Runtime)
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in $KEYCHAIN_PATH"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          # sign-app.sh signs Sparkle's nested XPC services / helpers inside-out
          # before the framework and then the app (with Hardened Runtime), and
          # runs a deep strict verify at the end.
          ./scripts/sign-app.sh build/MacConnect.app "$IDENTITY" "$KEYCHAIN_PATH"

      - name: Notarize
        id: notarize
        env:
          KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$KEY_BASE64" | base64 --decode > "$KEY_PATH"
          NOTARY_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent build/MacConnect.app "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait
          rm "$KEY_PATH"

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple build/MacConnect.app
          xcrun stapler validate build/MacConnect.app
          spctl -a -vv build/MacConnect.app

      - name: Zip stapled .app
        run: |
          cd build
          ditto -c -k --keepParent MacConnect.app "MacConnect-${{ steps.ver.outputs.tag }}.zip"

      - name: Build polished DMG from stapled .app
        run: |
          ./scripts/build-dmg.sh \
            build/MacConnect.app \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg" \
            "MacConnect"

      - name: Codesign the DMG
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          codesign --force --sign "$IDENTITY" --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"
          codesign --verify --verbose=2 "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"

      - name: Notarize and staple the DMG
        env:
          KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool submit \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg" \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait
          rm "$KEY_PATH"
          xcrun stapler staple "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"
          xcrun stapler validate "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"
          spctl -a -t open --context context:primary-signature -vv \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"

      - name: Show release artifacts
        run: ls -lh build/MacConnect-${{ steps.ver.outputs.tag }}.*

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "MacConnect ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --notes-file - <<'NOTES_EOF' \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.zip" \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"

          ## Install

          1. Download `MacConnect-${{ steps.ver.outputs.tag }}.dmg` (or the `.zip`).
          2. Open the DMG and drag MacConnect.app to Applications.
          3. Launch normally — the app is signed with Apple Developer ID and
             notarized, so Gatekeeper will not warn.

          Universal binary: arm64 + x86_64. Requires macOS 13+.

          See [README](https://github.com/${{ github.repository }}/blob/main/README.md)
          for what's working and what's not.
          NOTES_EOF

      # --- Sparkle appcast (Direct channel auto-update) ---
      # Gated on the signing secret so a release made before the Sparkle key is
      # configured still succeeds — it just publishes the DMG/zip without
      # refreshing the feed. The check reads the secret via env, never
      # interpolating it into a shell command.
      - name: Check for Sparkle signing key
        id: sparkle
        env:
          KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -n "$KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPARKLE_ED_PRIVATE_KEY not set — skipping appcast update. In-app updates stay on the previous feed."
          fi

      - name: Sign update and refresh appcast
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Official Sparkle CLI tools bundle (prebuilt generate_appcast/sign_update).
          SPARKLE_VER=2.9.3
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          GENERATE_APPCAST="$RUNNER_TEMP/sparkle/bin/generate_appcast"

          # EdDSA private key (the verbatim contents of `generate_keys -x`).
          KEYFILE="$RUNNER_TEMP/sparkle_ed_private.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"

          # Work dir: the current appcast (to preserve prior entries) plus the
          # new, notarized + stapled zip. generate_appcast merges + signs in place.
          WORK="$RUNNER_TEMP/appcast"
          mkdir -p "$WORK"
          curl -fsSL "https://alanhuang99.github.io/MacConnect/appcast.xml" \
            -o "$WORK/appcast.xml" || echo "No existing appcast (first Sparkle release)."
          cp "build/MacConnect-${{ steps.ver.outputs.tag }}.zip" "$WORK/"

          "$GENERATE_APPCAST" \
            --ed-key-file "$KEYFILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.ver.outputs.tag }}/" \
            --maximum-versions 0 \
            -o "$WORK/appcast.xml" \
            "$WORK"

          rm -f "$KEYFILE"
          echo "----- appcast.xml -----"
          cat "$WORK/appcast.xml"

      - name: Publish appcast to GitHub Pages
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/appcast"
          PAGES="$RUNNER_TEMP/pages"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$REMOTE" "$PAGES" 2>/dev/null; then
            cp "$WORK/appcast.xml" "$PAGES/appcast.xml"
          else
            # First run: gh-pages doesn't exist yet. Create it as an orphan branch.
            git clone --depth 1 "$REMOTE" "$PAGES"
            ( cd "$PAGES" && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true )
            cp "$WORK/appcast.xml" "$PAGES/appcast.xml"
          fi
          cd "$PAGES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "appcast: ${{ steps.ver.outputs.tag }}" || { echo "No appcast change."; exit 0; }
          git push origin gh-pages
