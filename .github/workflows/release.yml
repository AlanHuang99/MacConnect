name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build universal .app
        run: ./scripts/build-app.sh release-universal "${{ steps.ver.outputs.version }}"

      - name: Verify universal binary
        run: |
          file build/MacConnect.app/Contents/MacOS/MacConnect
          lipo -info build/MacConnect.app/Contents/MacOS/MacConnect

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign with Developer ID + Hardened Runtime
        env:
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements resources/MacConnect.entitlements \
            --sign "$TEAM_ID" \
            build/MacConnect.app
          codesign --verify --strict --verbose=2 build/MacConnect.app
          codesign --display --verbose=4 build/MacConnect.app

      - name: Notarize
        id: notarize
        env:
          KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$KEY_BASE64" | base64 --decode > "$KEY_PATH"
          NOTARY_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent build/MacConnect.app "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait
          rm "$KEY_PATH"

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple build/MacConnect.app
          xcrun stapler validate build/MacConnect.app
          spctl -a -vv build/MacConnect.app

      - name: Zip stapled .app
        run: |
          cd build
          ditto -c -k --keepParent MacConnect.app "MacConnect-${{ steps.ver.outputs.tag }}.zip"

      - name: Build DMG from stapled .app
        run: |
          STAGE="$(mktemp -d)"
          cp -R build/MacConnect.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "MacConnect" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"

      - name: Show release artifacts
        run: ls -lh build/MacConnect-${{ steps.ver.outputs.tag }}.*

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "MacConnect ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --notes-file - <<'NOTES_EOF' \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.zip" \
            "build/MacConnect-${{ steps.ver.outputs.tag }}.dmg"

          ## Install

          1. Download `MacConnect-${{ steps.ver.outputs.tag }}.dmg` (or the `.zip`).
          2. Open the DMG and drag MacConnect.app to Applications.
          3. Launch normally — the app is signed with Apple Developer ID and
             notarized, so Gatekeeper will not warn.

          Universal binary: arm64 + x86_64. Requires macOS 13+.

          See [README](https://github.com/${{ github.repository }}/blob/main/README.md)
          for what's working and what's not.
          NOTES_EOF
